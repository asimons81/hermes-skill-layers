[project]
name = "hermes-skill-layers"
version = "0.1.0"
description = "Preserved skill sources, writable derivatives, and explicit three-way reconciliation for Hermes"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = ["ruamel.yaml>=0.18.6,<0.19"]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2",
  "fastapi>=0.115,<1", "httpx>=0.27,<1",
]

[tool.setuptools]
package-dir = {"" = "dashboard/api"}

[tool.setuptools.packages.find]
where = ["dashboard/api"]
include = ["skill_layers*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["dashboard/api"]
exclude = ["work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["hermes_constants", "tools.skills_tool", "plugins.plugin_storage"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
